/* ---------- NEUMI faces (white line art on the black screen) ---------- */
function face(style, u, t, talk, blink, open) {

    for (const x of [-0.27, 0.27]) f += `<rect x="${(x - 0.21) * u}" y="${-0.25 * u}" width="${0.42 * u}" height="${0.38 * u}" rx="${0.09 * u}" ${st}/>` + eyeArc(x * u, -0.05 * u, 0.09 * u);

    const mh = (0.1 + 0.16 * m) * u;
    f += `<path d="M${-0.11 * u} ${0.24 * u} H${0.11 * u} Q${0.11 * u} ${0.24 * u + mh} 0 ${0.24 * u + mh} Q${-0.11 * u} ${0.24 * u + mh} ${-0.11 * u} ${0.24 * u} Z" ${st}/>`;
  } else if (style === "laugh") {
    const e = blink ? 0.02 : 0.08;
    f += `<path d="M${-0.36 * u} ${-0.24 * u} L${-0.2 * u} ${(-0.16 + e - 0.08) * u} L${-0.36 * u} ${-0.08 * u}" ${st}/>`;
    f += `<path d="M${0.36 * u} ${-0.24 * u} L${0.2 * u} ${(-0.16 + e - 0.08) * u} L${0.36 * u} ${-0.08 * u}" ${st}/>`;

                     : `<path d="M${ex - 13} -234 q13 -8 26 0" fill="none" stroke="#2a1a12" stroke-width="5" stroke-linecap="round"/>`;

    g += `</g>`;
  }
  g += `</g>`;
  if (tag) {
    const w = 30 + tag.length * 22;

  }
  return g;
}

/* ---------- graphic elements ---------- */
function logo(cx, cy, s, t, op = 1) {
  const d = 230 * s * (1 + 0.035 * Math.sin(t * Math.PI * 2 / 3.2));
  return `<image href="logo.png" x="${cx - d / 2}" y="${cy - d / 2}" width="${d}" height="${d}" opacity="${op}"/>`;
}
function particles(t, n, color, op) {
  let s = "";
  for (let i = 0; i < n; i++) {
    const sp = 40 + (i * 37) % 70, r = 5 + (i * 7) % 16;
    const x = (i * 263.7) % 1920 + 20 * Math.sin(t * .7 + i);
    const y = 1140 - ((t * sp + i * 173) % 1260);
    s += `<circle cx="${x}" cy="${y}" r="${r}" fill="${color}" opacity="${op}"/>`;
  }
  return s;
}
function card(x, y, w, h, fill = "#FFFDF3", op = 1, extra = "") {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="26" fill="${fill}" opacity="${op}" ${extra}/>`;
}
function popIn(t, a, d = .5) { const p = seg(t, a, a + d); return { p, s: back(p), op: clamp(p * 1.6) }; }
function personIcon(x, y, s, fill) {
  return `<g transform="translate(${x},${y}) scale(${s})"><circle cx="0" cy="-34" r="14" fill="${fill}"/><rect x="-16" y="-18" width="32" height="30" rx="12" fill="${fill}"/></g>`;
}

      ${txt(1000, 150, "what you see", { size: 24, fill: "#1D2C40" })}</g>`;

    if (st > 0) s += `<line x1="710" y1="204" x2="${lerp(710, 1290, st)}" y2="204" stroke="#750E1E" stroke-width="8" stroke-linecap="round"/>`;
    // underwater
    const items = [[760, 560, "Appointments months away"], [1240, 560, "Tests that take weeks"], [700, 720, "Costs for the family"], [1300, 720, "No early detection program"]];
    items.forEach(([x, y, w], i) => { const p = popIn(t, 33.2 + i * .55, .45);
      s += `<g opacity="${p.op}" transform="translate(${x},${y}) scale(${p.s})">${card(-215, -34, 430, 64, "#001A3B", .85)}${txt(0, 10, w, { size: 30 })}</g>`; });
    const cp = popIn(t, 35.6, .6);
    s += `<g opacity="${cp.op}" transform="translate(1000,850) scale(${cp.s})">${card(-260, -46, 520, 84, "#750E1E")}${txt(0, 12, "A system that fails", { size: 44, family: "Bebas Neue" })}</g>`;
    // banner
    const bp = popIn(t, 37.2, .6);
    s += `<g opacity="${bp.op}" transform="translate(1580,110) scale(${bp.s})">${card(-280, -56, 560, 104, "#001A3B")}${txt(0, 14, "Diagnosis culture", { size: 46, family: "Bebas Neue", fill: "#FDAF36" })}</g>`;
    s += txt(1580, 200, "beliefs, expectations and routines", { size: 26, fill: "#152340", opacity: bp.op });
    // Mafe on an ice floe
    const fy = wl + 4 * Math.sin(t * 2);
    s += `<ellipse cx="260" cy="${fy + 6}" rx="170" ry="26" fill="#FFFDF3" stroke="#D6D0A8" stroke-width="4"/>`;
    s += neumi(CAST.Mafe, 260, fy, .8, t, { talk: speaking("Mafe", t), seed: 4 });
    return s;
  }},
  { a: 40, b: 50, draw(t) { // 6. Triage, not a verdict
    let s = `<rect width="1920" height="1080" fill="#F2EED8"/>` + particles(t, 14, "#014040", .08);
    const bp = popIn(t, 40.2, .5);
    s += `<g opacity="${bp.op}" transform="translate(560,110) scale(${bp.s})">${card(-330, -56, 660, 104, "#001A3B")}${txt(0, 16, "Triage, not a verdict", { size: 52, family: "Bebas Neue", fill: "#FDAF36" })}</g>`;
    const nodes = [[330, 40.8, "Risk questionnaire", "1st level", "clip"], [800, 42.0, "NEUMA test", "2nd level", "lungs"], [1270, 43.2, "Confirmation", "biopsy & imaging", "check"]];
    s += `<line x1="330" y1="430" x2="${lerp(330, 1270, ease(seg(t, 40.8, 43.6)))}" y2="430" stroke="#014040" stroke-width="16" stroke-dasharray="2 30" stroke-linecap="round"/>`;
    for (const [x, at, h1, h2, ic] of nodes) {
      const p = popIn(t, at, .5);
      s += `<g opacity="${p.op}" transform="translate(${x},430) scale(${p.s})"><circle r="96" fill="#FFFDF3" stroke="${ic === "lungs" ? "#732231" : "#152340"}" stroke-width="10"/>
        ${ic === "clip" ? `<rect x="-34" y="-46" width="68" height="88" rx="10" fill="#014040"/><rect x="-18" y="-54" width="36" height="16" rx="6" fill="#001A3B"/><path d="M-20 -16 H20 M-20 4 H20 M-20 24 H8" stroke="#fff" stroke-width="6" stroke-linecap="round"/>` : ""}
        ${ic === "check" ? `<path d="M-36 2 L-10 28 L38 -24" fill="none" stroke="#014040" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>` : ""}
        ${txt(0, 150, h1, { size: 34, family: "Bebas Neue", fill: "#001A3B" })}${txt(0, 190, h2, { size: 28, fill: "#1D2C40" })}</g>`;
      if (ic === "lungs" && p.op > 0) s += logo(800, 430, .74 * p.s, t, p.op);
    }
    // patient and relative walking
    const pp = ease(seg(t, 43.6, 48.4));
    const px = lerp(150, 1270, pp), walking = t > 43.6 && t < 48.4;
    s += `<rect x="120" y="808" width="1260" height="14" rx="7" fill="#D6D0A8" opacity="${seg(t, 43.2, 43.6)}"/>`;
    s += neumi(EXTRAS.family, px - 95, 810, .48, t, { walk: walking, seed: 7, op: seg(t, 43.2, 43.6) });
    s += neumi(EXTRAS.patient, px, 810, .55, t, { walk: walking, seed: 6, op: seg(t, 43.2, 43.6) });
    // result comes with...
    const rp = popIn(t, 45.2, .6);
    s += `<g opacity="${rp.op}" transform="translate(1250,200) scale(${rp.s})">${card(-340, -96, 680, 168, "#FFFDF3", 1, `stroke="#732231" stroke-width="4"`)}
      ${txt(0, -42, "The result comes with:", { size: 30, family: "Bebas Neue", fill: "#750E1E" })}
      ${txt(0, 0, (t > 45.8 ? "✓ clear next steps  " : "") + (t > 46.5 ? "✓ careful words" : ""), { size: 30, fill: "#001A3B" })}
      ${txt(0, 44, t > 47.2 ? "✓ emotional support  ✓ family by your side" : "", { size: 28, fill: "#001A3B" })}</g>`;
    s += neumi(CAST.Sal, 1690, 830, .95, t, { talk: speaking("Sal", t), seed: 8, tag: "Sal" });
    return s;
  }},
  { a: 50, b: 60, draw(t) { // 7. Not our final breath
    let s = `<rect width="1920" height="1080" fill="url(#night)"/>` + particles(t, 34, "#EDE9C2", .13);
    s += logo(960, 250, 1.15, t, seg(t, 50, 50.6));
    s += txt(960, 470, "“We all always know something. We all ignore something.", { size: 40, fill: "#F2EED8", opacity: seg(t, 51, 51.8) });
    s += txt(960, 522, "Hence, we always learn.” — Taibo (2011)", { size: 40, fill: "#F2EED8", opacity: seg(t, 51.6, 52.4) });
    ROW.forEach(([k, x], i) => { const p = popIn(t, 50.2 + i * .12, .5);
      s += neumi(CAST[k], x, 830, .82, t, { talk: speaking(k, t), wave: t > 57, op: p.op * (1 - seg(t, 57, 57.6)), seed: i, tag: CAST[k].label }); });
    // closing
    const e = seg(t, 57, 57.8);
    if (e > 0) {
      s += `<rect width="1920" height="1080" fill="#001A3B" opacity="${e}"/>`;
      s += logo(960, 300, 1.2 * back(e), t, e);
      s += txt(960, 560, "NEUMA", { size: 140, family: "Bebas Neue", fill: "#F2EED8", opacity: e });
      s += txt(960, 630, "iGEM Puebla 2026 · Human Practices", { size: 40, fill: "#EDE9C2", opacity: seg(t, 57.4, 58) });
      s += txt(960, 720, "In lung cancer, every hour counts.", { size: 44, fill: "#FDAF36", opacity: seg(t, 58, 58.6) });
    }
    return s;
  }},
];

/* ---------- render ---------- */
const svg = document.getElementById("svg"), subs = document.getElementById("subs"), who = document.getElementById("who"), line = document.getElementById("line");
// Scenes were laid out on a 0-60 s design clock; stretch each one onto its voice clip.
function designTime(i, t) {
  const sc = SCENES[i], [A, B] = TIMELINE.scenes[i];
  if (i === SCENES.length - 1) { // keep the end card right after the last line
    const k = TIMELINE.speechEnd + 0.15;
    return t <= k ? sc.a + (t - A) / (k - A) * (57 - sc.a) : 57 + (t - k) / (B - k) * (sc.b - 57);
  }
  return sc.a + (t - A) / (B - A) * (sc.b - sc.a);
}
function renderAt(t) {
  t = clamp(t, 0, DURATION);
  REAL_T = t;
  let out = DEFS;
  for (let i = 0; i < SCENES.length; i++) {
    const [A, B] = TIMELINE.scenes[i];
    if (t < A || t > B + 0.45) continue;
    const op = i === 0 ? 1 : clamp((t - A) / 0.45);
    out += `<g opacity="${op}">${SCENES[i].draw(designTime(i, t))}</g>`;
  }
  svg.innerHTML = out;
  const l = LINES.find(l => t >= l.a - .05 && t <= l.b + .25);
  if (l) {
    const p = clamp((t - l.a) / Math.max(1.2, (l.b - l.a) * .55));
    const n = Math.round(l.text.length * p);
    const col = l.who === "All" ? "#FDAF36" : CAST[l.who].color;
    who.textContent = l.who; who.style.background = col;
    line.innerHTML = esc(l.text.slice(0, n)) + `<span class="ghost">${esc(l.text.slice(n))}</span>`;
    subs.classList.remove("hidden");
  } else subs.classList.add("hidden");
}
window.renderAt = renderAt;
// Decode every image layer up front so no frame is captured before its artwork is ready.
window.assetsReady = Promise.all(["logo.png", ...Object.values(RIG).flatMap(r => [r.body, ...r.arms.map(a => a.src)])]
  .map(src => { const im = new Image(); im.src = src; return im.decode().catch(() => {}); }));

/* ---------- player ---------- */
const capture = new URLSearchParams(location.search).has("capture");
if (capture) document.body.classList.add("capture");
const wrap = document.getElementById("wrap"), stage = document.getElementById("stage");
function fit() { stage.style.transform = `scale(${wrap.clientWidth / 1920})`; }
new ResizeObserver(fit).observe(wrap); fit();

let playing = false, t0 = 0, start = 0;
const playBtn = document.getElementById("play"), scrub = document.getElementById("scrub"), timeEl = document.getElementById("time");
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function setT(t) { t0 = t; scrub.value = t; timeEl.textContent = `${fmt(t)} / ${fmt(DURATION)}`; renderAt(t); }
function loop(now) {
  if (!playing) return;
  const t = voice.paused ? t0 + (now - start) / 1000 : voice.currentTime;
  if (t >= DURATION) { playing = false; voice.pause(); playBtn.textContent = "▶ Play"; setT(DURATION); return; }
  scrub.value = t; timeEl.textContent = `${fmt(t)} / ${fmt(DURATION)}`; renderAt(t);
  requestAnimationFrame(loop);
}
const voice = document.getElementById("voice");
function play() {
  if (t0 >= DURATION) t0 = 0;
  playing = true; start = performance.now(); playBtn.textContent = "❚❚ Pause";
  voice.currentTime = t0; voice.play().catch(() => {});
  requestAnimationFrame(loop);
}
function pause() { voice.pause(); if (!playing) return; playing = false; t0 = +scrub.value; playBtn.textContent = "▶ Play"; }
playBtn.onclick = () => playing ? pause() : play();
document.getElementById("restart").onclick = () => { pause(); setT(0); };
scrub.oninput = () => { pause(); setT(+scrub.value); };
document.fonts.ready.then(() => setT(0));
setT(0);
</script>
